/* targets: i686 x86_64

   xHCI host controllers on the PC: one the DSDT describes on the acpi
   root bus, with a mass storage device of two units, a HID device with a
   keyboard and a tablet, and a hub holding a keyboard and another mass
   storage device; and one on the i440FX with a mass storage device, its
   messages going to the local APIC. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "apic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "xhci", usb2_ports: 4, usb3_ports: 2,
                bus: { type: "usb", devices: [
                    {
                        type: "usb-storage",
                        bus: { type: "scsi", devices: [
                            { type: "scsi-disk", driver: "test",
                              sectors: 2304 },
                            { type: "scsi-disk", driver: "test",
                              sectors: 1152, read_only: 1 },
                        ] },
                    },
                    {
                        type: "usb-hid",
                        bus: { type: "hid", devices: [
                            { type: "hid-keyboard" },
                            { type: "hid-tablet" },
                        ] },
                    },
                    {
                        type: "usb-hub", ports: 3, port: 6,
                        bus: { type: "usb", devices: [
                            {
                                type: "usb-hid", port: 2,
                                bus: { type: "hid", devices: [
                                    { type: "hid-keyboard" },
                                ] },
                            },
                            {
                                type: "usb-storage", port: 3,
                                bus: { type: "scsi", devices: [
                                    { type: "scsi-disk", driver: "test",
                                      sectors: 1408 },
                                ] },
                            },
                        ] },
                    },
                ] },
            },
            {
                type: "pci-host-i440fx",
                bus: { type: "pci", devices: [
                    {
                        type: "xhci", usb2_ports: 2, usb3_ports: 1,
                        bus: { type: "usb", devices: [
                            {
                                type: "usb-storage",
                                bus: { type: "scsi", devices: [
                                    { type: "scsi-disk", driver: "test",
                                      sectors: 2816 },
                                ] },
                            },
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
