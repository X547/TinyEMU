/* targets: i686 x86_64

   The generic ECAM bridge on the PC, which only the acpi root bus
   describes: the DSDT gives its windows and _PRT, the MCFG its
   configuration space. INTx on IOAPIC lines, MSI to the local APIC. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "apic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-ecam-generic",
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(slot: 3, vectors: 8)@
                    @FIXTURE:pci-test(slot: 4, pin: 2)@
                    {
                        type: "pci-bridge",
                        bus: { type: "pci", devices: [
                            @FIXTURE:pci-test(pin: 1, vectors: 3)@
                            @FIXTURE:pci-test(pin: 4)@
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
