/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   The APLIC delivering directly to two harts. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    cpus: 2,
    interrupt_controller: "aplic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            @FIXTURE@
        ],
    },
}
