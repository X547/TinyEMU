/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   SD host controllers with test disks behind them: SD host controllers in
   the device tree with an eMMC device addressed in sectors, an SD card
   addressed in bytes and an empty slot; DesignWare hosts with 64 bit, 32
   bit and no DMA descriptors, holding a high capacity SD card, an eMMC
   device addressed in bytes and a write protected SD card; and an SD host
   controller on PCI with an SD card. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "sdhci",
                bus: { type: "sd", devices: [
                    { type: "mmc-card", driver: "test", sectors: 4196352 },
                ] },
            },
            {
                type: "sdhci",
                bus: { type: "sd", devices: [
                    { type: "sd-card", driver: "test", sectors: 4096 },
                ] },
            },
            { type: "sdhci" },
            {
                type: "dw-mmc", dma: 64,
                bus: { type: "sd", devices: [
                    { type: "sd-card", driver: "test", sectors: 4195328 },
                ] },
            },
            {
                type: "dw-mmc", dma: 32,
                bus: { type: "sd", devices: [
                    { type: "mmc-card", driver: "test", sectors: 3072 },
                ] },
            },
            {
                type: "dw-mmc", dma: 0,
                bus: { type: "sd", devices: [
                    { type: "sd-card", driver: "test", sectors: 2048,
                      read_only: 1 },
                ] },
            },
            {
                type: "pci-host-ecam-generic",
                bus: { type: "pci", devices: [
                    {
                        type: "sdhci",
                        bus: { type: "sd", devices: [
                            { type: "sd-card", driver: "test",
                              sectors: 6144 },
                        ] },
                    },
                ] },
            },
            @FIXTURE@
        ],
    },
}
