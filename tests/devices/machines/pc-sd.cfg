/* targets: i686 x86_64

   SD host controllers on the i440FX, with test disks behind them: a high
   capacity SD card and a write protected eMMC device addressed in bytes. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-i440fx",
                bus: { type: "pci", devices: [
                    {
                        type: "sdhci",
                        bus: { type: "sd", devices: [
                            { type: "sd-card", driver: "test",
                              sectors: 4195328 },
                        ] },
                    },
                    {
                        type: "sdhci",
                        bus: { type: "sd", devices: [
                            { type: "mmc-card", driver: "test",
                              sectors: 3072, read_only: 1 },
                        ] },
                    },
                ] },
            },
            @FIXTURE@
        ],
    },
}
