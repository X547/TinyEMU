/* targets: i686 x86_64

   The i440FX with the 8259s alone: INTx through the PIIX3's PIRQ routing,
   no MSI. Test functions on the root bus and behind a bridge. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-i440fx",
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(slot: 3)@
                    @FIXTURE:pci-test(slot: 4, pin: 2)@
                    {
                        type: "pci-bridge",
                        bus: { type: "pci", devices: [
                            @FIXTURE:pci-test(pin: 1)@
                            @FIXTURE:pci-test(pin: 4)@
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
