/* targets: riscv64-m riscv64-s riscv32-m riscv32-s
   tests: usb_audio.*

   USB audio devices on an xHCI host controller in the device tree, their
   host ends the "test" audio driver: one with a stereo output offering two
   rates and a mono headphone output at the host end's rate, and a
   composite device of a keyboard and another one with a single output. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "aplic-imsic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "xhci", usb2_ports: 2, usb3_ports: 0,
                bus: { type: "usb", devices: [
                    {
                        type: "usb-audio", port: 1,
                        bus: { type: "usb-audio", devices: [
                            { type: "usb-audio-output",
                              rates: [48000, 44100],
                              host: { driver: "test", tag: 1 } },
                            { type: "usb-audio-output", kind: "headphone",
                              channels: 1,
                              host: { driver: "test", tag: 2,
                                      rate: 44100, channels: 1 } },
                        ] },
                    },
                    {
                        type: "usb-device", port: 2,
                        bus: { type: "usb-function", devices: [
                            { type: "usb-hid", bus: { type: "hid", devices: [
                                { type: "hid-keyboard" },
                            ] } },
                            { type: "usb-audio",
                              bus: { type: "usb-audio", devices: [
                                { type: "usb-audio-output", kind: "line-out",
                                  host: { driver: "test", tag: 3 } },
                            ] } },
                        ] },
                    },
                ] },
            },
            @FIXTURE@
        ],
    },
}
