/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   The DesignWare root complex, as the generic part, and the PLDA one,
   each with a root port and its own MSI receiver: a switch with two test
   functions behind the first, one test function behind the second. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-designware",
                compatible: "snps,dw-pcie",
                bus: { type: "pci", devices: [
                    {
                        type: "pci-bridge",
                        bus: { type: "pci", devices: [
                            @FIXTURE:pci-test@
                            @FIXTURE:pci-test(pin: 2)@
                        ] },
                    },
                ] },
            },
            {
                type: "pci-host-plda",
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(pin: 3)@
                ] },
            },
            @FIXTURE@
        ],
    },
}
