/* targets: riscv64-m riscv64-s riscv32-m riscv32-s
   tests: iomem.*

   Probe windows registered with different widths, for the memory map's
   fitting of accesses to them. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-ecam-generic",
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(slot: 1, probe: [1, 2, 4, 8])@
                    @FIXTURE:pci-test(slot: 2, probe: [4])@
                    @FIXTURE:pci-test(slot: 3, probe: [4], probe_merge: true)@
                    @FIXTURE:pci-test(slot: 4, probe: [8], probe_merge: true)@
                    @FIXTURE:pci-test(slot: 5, probe: [1])@
                ] },
            },
            @FIXTURE@
        ],
    },
}
