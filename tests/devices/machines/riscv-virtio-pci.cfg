/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   Virtio over PCI, a console and test disks, behind a root complex by
   ECAM whose messages go to the IMSICs. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "aplic-imsic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-ecam-generic",
                io_size: 0,
                bus: { type: "pci", devices: [
                    { type: "virtio-console" },
                    { type: "virtio-block", driver: "test", sectors: 4096 },
                    { type: "virtio-block", driver: "test", sectors: 2048,
                      read_only: 1 },
                ] },
            },
            @FIXTURE@
        ],
    },
}
