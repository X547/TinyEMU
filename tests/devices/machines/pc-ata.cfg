/* targets: i686 x86_64

   The PIIX3's IDE function in compatibility mode, at the AT's ports and
   lines, with ATA disks, writable and read only, on the first channel and
   ATAPI CD drives, with and without a disc, on the second; all on test
   disks. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-i440fx",
                bus: { type: "pci", devices: [
                    {
                        type: "pci-ide",
                        bus: { type: "ata", devices: [
                            { type: "ata-disk", driver: "test",
                              sectors: 2560 },
                            { type: "ata-disk", driver: "test",
                              sectors: 1280, read_only: 1 },
                            { type: "atapi", bus: { type: "scsi", devices: [
                                { type: "scsi-cd", driver: "test",
                                  sectors: 6144 },
                            ] } },
                            { type: "atapi", bus: { type: "scsi", devices: [
                                { type: "scsi-cd" },
                            ] } },
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
