/* targets: i686 x86_64

   Two processors with local APICs and the IOAPIC. The test-control lines
   are three ISA lines, two on the first 8259 and one on the second, and
   one the IOAPIC alone has. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    cpus: 2,
    interrupt_controller: "apic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            @FIXTURE(irqs: [5, 7, 10, 16])@
        ],
    },
}
