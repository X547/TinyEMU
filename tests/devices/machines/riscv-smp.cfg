/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   Two harts and the PLIC, for what one hart does to another's contexts. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    cpus: 2,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            @FIXTURE@
        ],
    },
}
