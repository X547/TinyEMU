/* targets: i686 x86_64
   tests: usb_audio.*

   USB audio devices on an xHCI host controller the DSDT describes, their
   host ends the "test" audio driver, tagged 1 to 4 and 9: one with a stereo
   output offering two rates, a mono headphone output at the host end's
   rate, a stereo microphone offering two rates and a mono line input at
   the host end's rate, and a composite device of a keyboard and another
   one with a single output. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "apic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "xhci", usb2_ports: 2, usb3_ports: 0,
                bus: { type: "usb", devices: [
                    {
                        type: "usb-audio", port: 1,
                        bus: { type: "usb-audio", devices: [
                            { type: "usb-audio-output",
                              rates: [48000, 44100],
                              host: { driver: "test", tag: 1 } },
                            { type: "usb-audio-output", kind: "headphone",
                              channels: 1,
                              host: { driver: "test", tag: 2,
                                      rate: 44100, channels: 1 } },
                            { type: "usb-audio-input",
                              rates: [48000, 44100],
                              host: { driver: "test", tag: 3 } },
                            { type: "usb-audio-input", kind: "line-in",
                              channels: 1,
                              host: { driver: "test", tag: 4,
                                      rate: 44100, channels: 1 } },
                        ] },
                    },
                    {
                        type: "usb-device", port: 2,
                        bus: { type: "usb-function", devices: [
                            { type: "usb-hid", bus: { type: "hid", devices: [
                                { type: "hid-keyboard" },
                            ] } },
                            { type: "usb-audio",
                              bus: { type: "usb-audio", devices: [
                                { type: "usb-audio-output", kind: "line-out",
                                  host: { driver: "test", tag: 9 } },
                            ] } },
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
