/* targets: i686 x86_64

   Cloud Hypervisor's variant of the i440FX, with the IOAPIC and a local
   APIC, which collects MSIs. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "apic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-cloudhv",
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(slot: 3, vectors: 8)@
                    {
                        type: "pci-bridge",
                        bus: { type: "pci", devices: [
                            @FIXTURE:pci-test(pin: 2, vectors: 3)@
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
