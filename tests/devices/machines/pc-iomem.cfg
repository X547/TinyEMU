/* targets: i686 x86_64
   tests: iomem.*

   Probe windows registered with different widths, for the memory map's
   fitting of accesses to them, unaligned ones included. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-i440fx",
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(slot: 3, probe: [1, 2, 4, 8])@
                    @FIXTURE:pci-test(slot: 4, probe: [4])@
                    @FIXTURE:pci-test(slot: 5, probe: [4], probe_merge: true)@
                    @FIXTURE:pci-test(slot: 6, probe: [8], probe_merge: true)@
                    @FIXTURE:pci-test(slot: 7, probe: [1])@
                    @FIXTURE:pci-test(slot: 8, probe: [2], probe_unaligned: true)@
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
