/* targets: i686 x86_64

   Virtio over PCI, a console, on Cloud Hypervisor's variant of the
   i440FX with the IOAPIC and a local APIC, which collects MSI-X. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "apic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-cloudhv",
                bus: { type: "pci", devices: [
                    { type: "virtio-console" },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
