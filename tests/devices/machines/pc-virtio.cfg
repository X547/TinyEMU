/* targets: i686 x86_64

   Virtio over PCI, a console, test disks and a SCSI host, on Cloud
   Hypervisor's variant of the i440FX with the IOAPIC and a local APIC,
   which collects MSI-X. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "apic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-cloudhv",
                bus: { type: "pci", devices: [
                    { type: "virtio-console" },
                    { type: "virtio-block", driver: "test", sectors: 4096 },
                    { type: "virtio-block", driver: "test", sectors: 2048,
                      read_only: 1 },
                    {
                        type: "virtio-scsi",
                        bus: { type: "scsi", devices: [
                            { type: "scsi-disk", driver: "test",
                              sectors: 3072 },
                            { type: "scsi-disk", driver: "test", sectors: 1536,
                              read_only: 1 },
                            { type: "scsi-cd", driver: "test", sectors: 8192 },
                            { type: "scsi-cd" },
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
