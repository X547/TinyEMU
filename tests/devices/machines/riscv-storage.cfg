/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   Storage controllers, with test disks behind them, behind a root complex
   by ECAM whose messages go to the IMSICs: a BusLogic SCSI host adapter
   with disks and CD drives, an IDE controller in native mode with ATA
   disks and an ATAPI CD drive, and an NVMe controller with two
   namespaces; and two CFI flashes, one write protected with an image
   shorter than its array. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "aplic-imsic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            { type: "cfi-flash", driver: "test", sectors: 256,
              block_size: 32 },
            { type: "cfi-flash", driver: "test", sectors: 96,
              block_size: 16, read_only: 1 },
            {
                type: "pci-host-ecam-generic",
                bus: { type: "pci", devices: [
                    {
                        type: "buslogic",
                        bus: { type: "scsi", devices: [
                            { type: "scsi-disk", driver: "test",
                              sectors: 3072 },
                            { type: "scsi-disk", driver: "test",
                              sectors: 1536, read_only: 1 },
                            { type: "scsi-cd", driver: "test",
                              sectors: 8192 },
                            { type: "scsi-cd" },
                        ] },
                    },
                    {
                        type: "pci-ide",
                        bus: { type: "ata", devices: [
                            { type: "ata-disk", driver: "test",
                              sectors: 2560 },
                            { type: "ata-disk", driver: "test",
                              sectors: 1280, read_only: 1 },
                            { type: "atapi", bus: { type: "scsi", devices: [
                                { type: "scsi-cd", driver: "test",
                                  sectors: 6144 },
                            ] } },
                        ] },
                    },
                    {
                        type: "nvme",
                        bus: { type: "nvme", devices: [
                            { type: "nvme-ns", driver: "test",
                              sectors: 3584 },
                            { type: "nvme-ns", driver: "test",
                              sectors: 1792, read_only: 1 },
                        ] },
                    },
                ] },
            },
            @FIXTURE@
        ],
    },
}
