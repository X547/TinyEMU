/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   Storage controllers, with test disks behind them, behind a root complex
   by ECAM: a BusLogic SCSI host adapter with disks and CD drives, and an
   IDE controller in native mode with ATA disks and an ATAPI CD drive. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-ecam-generic",
                bus: { type: "pci", devices: [
                    {
                        type: "buslogic",
                        bus: { type: "scsi", devices: [
                            { type: "scsi-disk", driver: "test",
                              sectors: 3072 },
                            { type: "scsi-disk", driver: "test",
                              sectors: 1536, read_only: 1 },
                            { type: "scsi-cd", driver: "test",
                              sectors: 8192 },
                            { type: "scsi-cd" },
                        ] },
                    },
                    {
                        type: "pci-ide",
                        bus: { type: "ata", devices: [
                            { type: "ata-disk", driver: "test",
                              sectors: 2560 },
                            { type: "ata-disk", driver: "test",
                              sectors: 1280, read_only: 1 },
                            { type: "atapi", bus: { type: "scsi", devices: [
                                { type: "scsi-cd", driver: "test",
                                  sectors: 6144 },
                            ] } },
                        ] },
                    },
                ] },
            },
            @FIXTURE@
        ],
    },
}
