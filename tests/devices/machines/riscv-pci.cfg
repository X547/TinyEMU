/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   A root complex by ECAM with the PLIC, so with nothing to collect MSIs:
   test functions on the root bus, one of them with two functions, and two
   behind a switch. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-ecam-generic",
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(slot: 1)@
                    @FIXTURE:pci-test(slot: 2, pin: 2, multifunction: true)@
                    @FIXTURE:pci-test(slot: 2, function: 3, pin: 4)@
                    {
                        type: "pci-bridge",
                        bus: { type: "pci", devices: [
                            @FIXTURE:pci-test(pin: 3)@
                            @FIXTURE:pci-test(pin: 1)@
                        ] },
                    },
                ] },
            },
            @FIXTURE@
        ],
    },
}
