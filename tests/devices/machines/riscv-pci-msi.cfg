/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   A root complex by ECAM whose messages go to the IMSICs, and which has
   no I/O window: a test function on the root bus and one behind a
   switch. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    interrupt_controller: "aplic-imsic",
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-ecam-generic",
                io_size: 0,
                bus: { type: "pci", devices: [
                    @FIXTURE:pci-test(slot: 1, vectors: 8)@
                    {
                        type: "pci-bridge",
                        bus: { type: "pci", devices: [
                            @FIXTURE:pci-test(pin: 2, vectors: 3)@
                        ] },
                    },
                ] },
            },
            @FIXTURE@
        ],
    },
}
