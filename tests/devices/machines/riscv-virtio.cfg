/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   Virtio over MMIO: a console, which takes temu's console input, and
   test disks, writable and read only; a SCSI host with disks and CD
   drives on test disks. And the SiFive test device's power
   off register. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            { type: "virtio-console" },
            { type: "virtio-block", driver: "test", sectors: 4096 },
            { type: "virtio-block", driver: "test", sectors: 2048,
              read_only: 1 },
            {
                type: "virtio-scsi",
                bus: { type: "scsi", devices: [
                    { type: "scsi-disk", driver: "test", sectors: 3072 },
                    { type: "scsi-disk", driver: "test", sectors: 1536,
                      read_only: 1 },
                    { type: "scsi-cd", driver: "test", sectors: 8192 },
                    { type: "scsi-cd" },
                ] },
            },
            { type: "syscon-poweroff" },
            @FIXTURE@
        ],
    },
}
