/* targets: riscv64-m riscv64-s riscv32-m riscv32-s

   Virtio over MMIO, here a console, which takes temu's console input,
   and the SiFive test device's power off register. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            { type: "virtio-console" },
            { type: "syscon-poweroff" },
            @FIXTURE@
        ],
    },
}
