/* targets: i686 x86_64

   Storage controllers on the i440FX, with test disks behind them: a
   BusLogic SCSI host adapter with disks and CD drives, and an NVMe
   controller with two namespaces, on INTx. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            {
                type: "pci-host-i440fx",
                bus: { type: "pci", devices: [
                    {
                        type: "buslogic",
                        bus: { type: "scsi", devices: [
                            { type: "scsi-disk", driver: "test",
                              sectors: 3072 },
                            { type: "scsi-disk", driver: "test",
                              sectors: 1536, read_only: 1 },
                            { type: "scsi-cd", driver: "test",
                              sectors: 8192 },
                            { type: "scsi-cd" },
                        ] },
                    },
                    {
                        type: "nvme",
                        bus: { type: "nvme", devices: [
                            { type: "nvme-ns", driver: "test",
                              sectors: 3584 },
                            { type: "nvme-ns", driver: "test",
                              sectors: 1792, read_only: 1 },
                        ] },
                    },
                ] },
            },
            @FIXTURE(irqs: 0)@
        ],
    },
}
