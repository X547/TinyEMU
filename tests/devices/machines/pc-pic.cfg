/* targets: i686 x86_64

   The 8259s alone, with test-control lines on both. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            @FIXTURE(irqs: [3, 5, 10, 11])@
        ],
    },
}
