/* targets: riscv64-m riscv64-s riscv32-m riscv32-s i686 x86_64

   The smallest machine: a UART and the test-control device. run.py fills
   in the @...@ placeholders for each target. */
{
    version: 2,
    machine: "@MACHINE@",
    memory_size: 64,
    @BOOT@,
    cmdline: "@CMDLINE@",
    bus: {
        type: "@ROOT@",
        devices: [
            { type: "ns16550a" },
            @FIXTURE@
        ],
    },
}
