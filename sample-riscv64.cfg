/* Sample TinyEMU configuration, format version 2.

   Devices are declared inside the bus they attach to. A device that provides
   a bus of its own carries a nested "bus" object, so the nesting in this file
   is the nesting of the buses in the machine:

       FDT bus -> pci-host-ecam-generic -> PCI bus -> virtio devices

   MMIO addresses and interrupt lines are not written here: they are allocated
   when the machine is built, checked against each other, and then described
   to the guest in the device tree from the values that were actually
   assigned. */
{
    version: 2,
    machine: "riscv64",
    memory_size: 256,
    bios: "bbl64.bin",
    kernel: "kernel-riscv64.bin",
    cmdline: "console=hvc0 root=/dev/vda rw",

    bus: {
        type: "fdt",
        devices: [
            /* 16550 serial port; also becomes /chosen/stdout-path */
            { type: "ns16550a" },

            { type: "simplefb", width: 1024, height: 768 },

            /* virtio over MMIO, straight on the FDT bus */
            { type: "virtio-console" },
            { type: "virtio-block", file: "root-riscv64.bin" },

            /* ...or over PCI, behind a generic ECAM host bridge. The bridge
               reserves its ECAM window and its memory aperture from the same
               MMIO space as everything else, so the aperture it publishes in
               the device tree cannot overlap RAM or another device. */
            {
                type: "pci-host-ecam-generic",
                id: "pcie0",
                bus_count: 16,  /* ECAM window is bus_count MB */
                mmio_size: 256, /* aperture size in MB */
                /* The aperture above 4 GB, where the 64 bit base address
                   registers the NVMe and xHCI controllers declare can go.
                   4096 MB unless asked otherwise; 0 leaves the bridge with
                   only the 32 bit aperture.

                mmio64_size: 1024,
                */
                bus: {
                    type: "pci",
                    devices: [
                        { type: "virtio-net", driver: "user" },
                        { type: "virtio-input", kind: "keyboard" },
                        { type: "virtio-input", kind: "tablet" },
                        /* { type: "virtio-9p", file: "/tmp",
                             tag: "/dev/root" }, */

                        /* A switch, with the devices declared inside it one
                           tier further down. Each of them gets a downstream
                           port of its own, because a PCI Express link
                           carries one device; nest another "pci-bridge"
                           inside for a deeper hierarchy.

                        {
                            type: "pci-bridge",
                            id: "sw0",
                            bus: {
                                type: "pci",
                                devices: [
                                    { type: "virtio-input",
                                      kind: "keyboard" },
                                ],
                            },
                        },
                        */

                        /* An NVMe controller and one namespace. Add
                           "quirks" only for a guest that needs it; the
                           names are listed in readme.txt.

                        {
                            type: "nvme",
                            bus: {
                                type: "nvme",
                                devices: [
                                    { type: "nvme-ns",
                                      file: "nvme-disk.bin" },
                                ],
                            },
                        },
                        */

                        /* A USB stack, declared all the way down: the
                           controller, the hub below it, the mass storage
                           device below that, and the SCSI disk that finally
                           names an image file. The hub is optional; drop it
                           and the storage device sits on a root port. */
                        {
                            type: "xhci",
                            bus: {
                                type: "usb",
                                devices: [
                                    {
                                        type: "usb-hub",
                                        ports: 4,
                                        bus: {
                                            type: "usb",
                                            devices: [
                                                {
                                                    type: "usb-storage",
                                                    bus: {
                                                        type: "scsi",
                                                        devices: [
                                                            {
                                                                type: "scsi-disk",
                                                                file: "usb-disk.bin",
                                                            },
                                                        ],
                                                    },
                                                },
                                            ],
                                        },
                                    },
                                ],
                            },
                        },
                    ],
                },
            },

            /* ...or behind a Synopsys DesignWare root complex. Unlike the
               ECAM bridge this one has a root port of its own, so devices are
               enumerated behind it rather than on bus 0, and it carries a
               message signalled interrupt receiver, which is what lets the
               devices below advertise MSI-X. The bus behind a root port
               carries one device, so declaring several here puts a switch
               between them, exactly as "pci-bridge" does.

               "compatible" decides which guest driver binds to it, and
               defaults to the SiFive FU740 the Haiku driver probes for.
               "mmio_size" is the aperture size in MB, as above.

            {
                type: "pci-host-designware",
                id: "pcie1",
                compatible: "sifive,fu740-pcie",
                mmio_size: 256,
                bus: {
                    type: "pci",
                    devices: [
                        { type: "virtio-net", driver: "user" },
                    ],
                },
            },
            */
        ],
    },
}
