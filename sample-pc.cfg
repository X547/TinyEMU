/* Sample TinyEMU configuration for the PC machine, format version 2.

   Devices are declared inside the bus they attach to, so the nesting here is
   the nesting of the buses in the machine:

       pc bus -> pci-host-i440fx -> PCI bus -> pci-ide -> ATA bus -> ata-disk

   Unlike an FDT machine, nothing here is placed by the emulator: a PC's
   devices sit at the addresses a PC has had since the AT, and the machine
   only checks that two of them have not been declared on top of each other.
   Only the parts a PC decodes by port number go straight on the pc bus;
   everything else is a PCI device and belongs inside the host bridge.

   The x86 machine runs under KVM when it can, and on the i686 interpreter
   otherwise or with -no-accel. */
{
    version: 2,
    machine: "pc",
    memory_size: 256,

    /* SeaBIOS, and SeaVGABIOS for the "vga" device below. Both are resolved
       relative to this file. */
    bios: "bios.bin",
    vga_bios: "vgabios.bin",

    bus: {
        type: "pc",
        devices: [
            /* COM1, at 0x3f8 on line 4. "reg" and "irq" name another port and
               line, for COM2 (0x2f8, line 3) and the rest. */
            { type: "ns16550a" },

            /* The keyboard controller, with the keyboard and the pointer a PC
               has on its two ports. "vmmouse: 0" leaves out the backdoor port
               the absolute pointer protocol is read through. */
            { type: "ps2" },

            {
                type: "pci-host-i440fx",
                bus: {
                    type: "pci",
                    devices: [
                        { type: "vga", width: 1024, height: 768 },

                        /* The southbridge's IDE function, in compatibility
                           mode: its channels answer 0x1f0 and 0x170 on lines
                           14 and 15, and only the bus master block is placed
                           by a base address register. The drives fill the
                           channels in the order they appear: master and slave
                           of the first, then of the second. */
                        {
                            type: "pci-ide",
                            bus: {
                                type: "ata",
                                devices: [
                                    { type: "ata-disk", file: "disk.img" },
                                ],
                            },
                        },

                        /* The virtio devices work here exactly as they do on
                           a RISC-V machine's PCI bus; see sample-riscv64.cfg
                           for the rest of them.

                        { type: "virtio-block", file: "root.img" },
                        { type: "virtio-net", driver: "user" },
                        { type: "virtio-console" },
                        */
                    ],
                },
            },
        ],
    },
}
